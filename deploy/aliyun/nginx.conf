# Replace game.example.com and certificate paths before enabling this site.
server {
    listen 80;
    server_name game.example.com;
    return 301 https://game.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name game.example.com;
    ssl_certificate /etc/nginx/certs/game.example.com.pem;
    ssl_certificate_key /etc/nginx/certs/game.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/sanguo/current/dist;
    index index.html;
    client_max_body_size 400k;
    add_header X-Content-Type-Options nosniff always;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host game.example.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 30s;
        add_header Cache-Control no-store always;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
}
